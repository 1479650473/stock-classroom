[package]
name = "stock-classroom"
version = "5.0.0"
description = "A股量化教室"
authors = ["you"]
edition = "2021"

[lib]
name = "stock_classroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
